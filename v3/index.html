  /* Layout: one centred column (home, session, summary, overview screens); the card keeps the v1 design. */
  :root{
    --bg:#f3eee4; --card:#fffdf8; --ink:#1f2a2e; --ink-soft:#5d686c; --ink-faint:#b9b2a5; --line:#1f2a2e;
    --surface:#ffffff; --border:#e6dfd2; --border-strong:#d6cfc2; --ru:#33454b; --shadow:rgba(60,40,10,.10);
    --hl-bg:#dcf2df; --hl-border:#7cc48d;   /* light green: highlighted form cell */
    --hl-letter:#2fa356;                     /* lighter green: letter inside words */
    --flip:#1f6b3a; --flip-d:#17542d;       /* dark green flip button */
    --happy:#34a35a; --happy-d:#2a8a4b;     /* "I knew that" */
    --sad:#ec7a72; --sad-d:#dd625a;         /* light red: "still to learn" */
    --b0:#d9d3c7; --b1:#ec7a72; --b2:#f2a65a; --b3:#e9cf5b; --b4:#9fd18a; --b5:#34a35a;  /* Leitner boxes */
    --primary:#1f2a2e; --primary-fg:#ffffff;
    --start:#16a34a; --start-d:#128a3e; --start-fg:#ffffff;   /* bright green Start button */
    --ar:"Noto Naskh Arabic Local","Noto Naskh Arabic","Geeza Pro","Arabic Typesetting","Traditional Arabic",serif;
    --ui:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#15191b; --card:#20272a; --ink:#e9e5dd; --ink-soft:#a4adb0; --ink-faint:#5f686b; --line:#e9e5dd;
    --surface:#283033; --border:#354044; --border-strong:#46524f; --ru:#c3ced1; --shadow:rgba(0,0,0,.45);
    --hl-bg:#1d3a26; --hl-border:#4f9a63; --hl-letter:#7fe0a0;
    --flip:#2f8a50; --flip-d:#27744a; --happy:#3aa862; --happy-d:#2f8f53; --sad:#e2716a; --sad-d:#cc5e57;
    --b0:#3a4346; --b1:#c95c55; --b2:#c98a45; --b3:#bfa640; --b4:#6fa860; --b5:#3aa862;
    --primary:#e9e5dd; --primary-fg:#15191b; --start:#22c55e; --start-d:#1fb055; --start-fg:#0b1f12; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#15191b; --card:#20272a; --ink:#e9e5dd; --ink-soft:#a4adb0; --ink-faint:#5f686b; --line:#e9e5dd;
    --surface:#283033; --border:#354044; --border-strong:#46524f; --ru:#c3ced1; --shadow:rgba(0,0,0,.45);
    --hl-bg:#1d3a26; --hl-border:#4f9a63; --hl-letter:#7fe0a0;
    --flip:#2f8a50; --flip-d:#27744a; --happy:#3aa862; --happy-d:#2f8f53; --sad:#e2716a; --sad-d:#cc5e57;
    --b0:#3a4346; --b1:#c95c55; --b2:#c98a45; --b3:#bfa640; --b4:#6fa860; --b5:#3aa862;
    --primary:#e9e5dd; --primary-fg:#15191b; --start:#22c55e; --start-d:#1fb055; --start-fg:#0b1f12; color-scheme:dark }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);min-height:100vh;font-size:15px;
       padding-top:max(14px, env(safe-area-inset-top, 0px));padding-bottom:max(20px, env(safe-area-inset-bottom, 0px));
       padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  [hidden]{display:none!important}
  .wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
  .hl{font-weight:700;color:var(--hl-letter)}
  .ctx{font-weight:400}
  .t{color:var(--ink-faint);font-weight:400}
  .l{font-weight:700;color:var(--ink)}
  button{font:inherit;color:inherit}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--hl-border);outline-offset:2px}
  .btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:14px}
  .btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:600}
  #startBtn{background:var(--start);border-color:var(--start);color:var(--start-fg);font-size:16px;padding:12px 20px}
  #startBtn:hover{background:var(--start-d);border-color:var(--start-d)}
  #startBtn:disabled{opacity:.45;cursor:not-allowed}
  .btn.small{padding:6px 10px;font-size:13px}
  .linkbtn{background:none;border:0;padding:4px 0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:13px}
  h1{font-size:20px;margin:4px 0 0;text-align:center}
  #home{position:relative} #home > h1{padding:0 64px}
  .langsw{position:absolute;top:0;right:0;display:flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden}
  .langsw button{border:0;background:var(--surface);color:var(--ink-soft);font:600 11px/1 var(--ui);letter-spacing:.04em;padding:6px 8px;cursor:pointer}
  .langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 8px;font-weight:600}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
  .muted{color:var(--ink-soft);font-size:13px}

  /* home: progress */
  .stats{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
  .stat{flex:1;text-align:center}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--ink-soft)}
  .boxbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--b0)}
  .boxbar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

  /* home: setup */
  .field{margin-bottom:12px}
  .field>label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{padding:7px 11px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:13.5px}
  .seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
  .picker{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
  .picker button{aspect-ratio:1;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-family:var(--ar);font-size:20px;line-height:1;padding:0}
  .picker button[aria-pressed="true"]{background:var(--hl-bg);border-color:var(--hl-border);font-weight:700}
  .startrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .hist{list-style:none;margin:0;padding:0;font-size:13.5px}
  .hist li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
  .hist li:first-child{border-top:0}
  .hist .r{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tools{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}

  /* session bar */
  .sbar{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;margin:0 auto 10px}
  .prog{flex:1}
  .prog .track{height:6px;border-radius:3px;background:var(--b0);overflow:hidden}
  .prog .fill{height:100%;background:var(--hl-letter);width:0;transition:width .25s}
  .prog .num{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
  .tally{display:flex;gap:8px;font-size:13px;font-variant-numeric:tabular-nums;align-items:center}
  .tally span{display:flex;align-items:center;gap:3px}
  .tally svg{width:16px;height:16px}
  .tally .h{color:var(--happy)} .tally .s{color:var(--sad)}

  /* card */
  .stage{perspective:1400px;display:flex;justify-content:center}
  .card{width:min(360px,100%);height:600px;height:clamp(520px, calc(100svh - 120px), 640px);position:relative}
  .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);
        border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px var(--shadow);overflow:hidden}
  .back{transform:rotateY(180deg)}
  .front{display:flex;flex-direction:column;align-items:center;padding:28px 20px 26px}
  .front-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
  .f-glyph{font-size:140px;line-height:1.35}
  .name-lat{font-weight:700} .name-ru{font-weight:400;color:var(--ink-soft)}

  .v-front .big{font-family:var(--ar);direction:rtl;font-size:104px;line-height:1.3;font-weight:700;width:100%;white-space:nowrap;overflow:hidden}
  .v-front .mid{font-family:var(--ar);direction:rtl;font-size:58px;line-height:1.35;font-weight:700;width:100%;white-space:nowrap;overflow:hidden}
  .v-front .dict{font-family:var(--ar);direction:rtl;font-size:30px;line-height:1.5;width:100%;white-space:nowrap;overflow:hidden;color:var(--ink-soft)}

<!-- ============ HOME ============ -->
<main class="wrap" id="home">
  <div class="langsw" id="langSw" role="group" aria-label="Interface language"><button data-l="en">EN</button><button data-l="ru">RU</button></div>
  <h1 data-i18n>Arabic Flashcards</h1>

  <section class="panel" aria-labelledby="h-progress">
    <h2 id="h-progress"><span data-i18n>Your progress</span> · <span id="progDeck">letters</span></h2>
    <div class="stats">
      <div class="stat"><b id="stKnown">0</b><span data-i18n>known</span></div>
      <div class="stat"><b id="stLearn">0</b><span data-i18n>still learning</span></div>
      <div class="stat"><b id="stNew">0</b><span data-i18n>new</span></div>
    </div>
    <div class="boxbar" id="boxbar"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel" aria-labelledby="h-setup">
    <h2 id="h-setup" data-i18n>New session</h2>
    <div class="field"><label data-i18n>Deck</label>
      <div class="seg" id="cfgDeck" data-key="deck">
        <button data-v="letters" data-i18n>Letters</button><button data-v="numbers" data-i18n>Numbers</button><button data-v="verbs" data-i18n>Verbs</button><button data-v="special" data-i18n>Special words</button><button data-v="nouns" data-i18n>Nouns</button><button data-v="time" data-i18n>Time</button><button data-v="adj" data-i18n>Adjectives</button>
      </div>
    </div>
    <div class="field" id="fNum"><label data-i18n>Numbers</label>
      <div class="seg" id="cfgNum" data-key="ngroup">
        <button data-v="all" data-i18n>All</button><button data-v="units">0–10</button><button data-v="teens">11–19</button><button data-v="tens">20–90</button><button data-v="hundreds">100–900</button><button data-v="big">1000+</button>
      </div>
    </div>
    <div class="field" id="fSW"><label data-i18n>Words</label>
      <div class="seg" id="cfgSW" data-key="swgroup">
        <button data-v="all" data-i18n>All</button><button data-v="q" data-i18n>Question words</button><button data-v="prep" data-i18n>With · without · about · have</button>
      </div>
    </div>
    <div class="field" id="fTG"><label data-i18n>Words</label>
      <div class="seg" id="cfgTG" data-key="tgroup">
        <button data-v="all" data-i18n>All</button><button data-v="day" data-i18n>Days of the week</button><button data-v="word" data-i18n>Day · month · year …</button>
      </div>
    </div>
    <div class="field" id="fVPart"><label data-i18n>Cards</label>
      <div class="seg" id="cfgVPart" data-key="vpart">
        <button data-v="all" data-i18n>All</button><button data-v="pronpat" data-i18n>Pronouns + patterns</button><button data-v="pron" data-i18n>Pronouns</button><button data-v="pat" data-i18n>Patterns</button><button data-v="conj" data-i18n>Conjugation</button><button data-v="read" data-i18n>Verbs</button>
      </div>
    </div>
    <div class="field" id="fVTenses"><label data-i18n>Tenses</label>
      <div class="seg multi" id="cfgVTenses" data-key="vtenses">
        <button data-v="past" data-i18n>Past</button><button data-v="pres" data-i18n>Present</button><button data-v="fut" data-i18n>Future</button>
      </div>
    </div>
    <div class="field" id="fVVerbs"><label data-i18n>Verbs</label>
      <div class="seg multi vverbs" id="cfgVVerbs" data-key="vverbs"></div>

<script>
const DB = JSON.parse(document.getElementById('db').textContent);
const FORM_ORDER = ['isolated','initial','medial','final'];
const ZWJ = '‍', TAT = 'ـ';
const $ = id => document.getElementById(id);

/* ---------- Arabic joining helpers ---------- */
const MARKS = /[ً-ٰٟ]/;
const NO_NEXT = new Set([...'اأإآٱدذرزوؤةىء']);
const isAr = c => /[ؠ-يٱ-ۓـ]/.test(c);
const base = (s, fromEnd) => { const a=[...s]; if(fromEnd) a.reverse(); return a.find(c=>!MARKS.test(c)) || ''; };
const joinsNext = c => isAr(c) && !NO_NEXT.has(c);
const joinsPrev = c => isAr(c) && c !== 'ء';
function joinedHTML(pre, t, post, clsCtx, clsT){
  const j1 = pre  && joinsNext(base(pre,true)) && joinsPrev(base(t));
  const j2 = post && joinsNext(base(t,true))   && joinsPrev(base(post));
  return (pre ? `<span class="${clsCtx}">${pre}${j1?ZWJ:''}</span>` : '') +
         `<span class="${clsT}">${j1?ZWJ:''}${t}${j2?ZWJ:''}</span>` +
         (post ? `<span class="${clsCtx}">${j2?ZWJ:''}${post}</span>` : '');
}
const isValid = (L,f) => f==='isolated' || (f==='initial'&&L.connectsNext) || (f==='medial'&&L.connectsNext&&L.connectsPrev) || (f==='final'&&L.connectsPrev);
function formGlyph(L, form){
  const p = { isolated:['',L.char,''], initial:['',L.char,TAT], medial:[TAT,L.char,TAT], final:[TAT,L.char,''] }[form];
  return joinedHTML(p[0], p[1], p[2], 't', 'l');
}
const nameHTML = L => `<span class="name-lat">${L.name}</span><span class="name-ru">${L.nameRu}</span>`;
const prHTML = w => `<div class="pr"><div class="p-lat">${w.tr}</div><div class="p-ru">${w.trRu}</div></div>`;

/* ---------- Cards ---------- */
const ALL = [];
for (const L of DB.letters) {
  for (const form of FORM_ORDER) if (isValid(L,form) && L.words[form]) ALL.push({id:`${L.id}-${form}-A`, L, form, w:L.words[form], opt:'A'});
  ALL.push({id:`${L.id}-B`, L, form:null, opt:'B'});
}
ALL.forEach(c => c.deck = 'letters');
const NUMDB = JSON.parse(document.getElementById('numdb').textContent);
for (const n of NUMDB.numbers) ALL.push({id:`num-${n.id}`, deck:'numbers', n, opt:'N'});
/* verbs deck: pronouns, patterns (incl. particles), conjugation */
const VERBDB = JSON.parse(document.getElementById('verbdb').textContent);
const VP = VERBDB.persons, VTENSE = VERBDB.tenses, VMODE = VERBDB.modes, VBYID = Object.fromEntries(VERBDB.verbs.map(v => [v.id, v]));
const PRON = Object.fromEntries(VERBDB.pronouns.map(p => [p.id, p]));
for (const p of VERBDB.pronouns) ALL.push({id:`vp-${p.id}`, deck:'verbs', kind:'pron', p:p.id});
for (const t of Object.keys(VTENSE)) for (const p of VP) ALL.push({id:`vpat-${t}-${p}`, deck:'verbs', kind:'pat', t, p});
for (const x of VERBDB.particles) ALL.push({id:`vprt-${x.id}`, deck:'verbs', kind:'prt', x});
for (const v of VERBDB.verbs) for (const t of Object.keys(VTENSE)) for (const m of Object.keys(VMODE)) for (const p of VP)
  ALL.push({id:`vc-${v.id}-${t}-${m}-${p}`, deck:'verbs', kind:'conj', v:v.id, t, m, p});
/* special words + nouns */
const WORDDB = JSON.parse(document.getElementById('worddb').textContent);
for (const q of WORDDB.questions) ALL.push({id:`sw-q-${q.id}`, deck:'special', kind:'q', w:q});
for (const p of WORDDB.preps) ALL.push({id:`sw-p-${p.id}`, deck:'special', kind:'prep', w:p});
for (const n of WORDDB.nouns) ALL.push({id:`nn-${n.id}`, deck:'nouns', kind:'noun', w:n});
for (const t of WORDDB.time) ALL.push({id:`tm-${t.id}`, deck:'time', kind:'time', w:t});
for (const a of WORDDB.adjs) ALL.push({id:`adj-${a.id}`, deck:'adj', kind:'adj', w:a});
const WDECKS = new Set(['special', 'nouns', 'time', 'adj']);
const BYID = Object.fromEntries(ALL.map(c => [c.id, c]));
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toArabicDigits = n => String(n).replace(/[0-9]/g, d => AR_DIGITS[d]);
const fmtNum = n => n.toLocaleString('en-US');
const numKey = (n, f) => f.g ? `${n.id}-${f.g}` : n.id;

/* ---------- Storage (this browser only) ---------- */
const KEY = 'arabicFlashcards.v3', OLD_KEY = 'arabicLetterCards.v2';   // v3 keeps its own progress; v2 progress is copied the first time
const DEFAULT_CFG = {deck:'letters', ngroup:'all', letters:'all', picked:[], types:'AB', focus:'mix', len:'20', voice:'both',
  vpart:'all', vtenses:['past','pres','fut'], vverbs:VERBDB.verbs.map(v => v.id), vmodes:['pos'], vdir:'mix', swgroup:'all', tgroup:'all', lang:'en'};
let storageOK = true;
function load(){
  try {
    let s = JSON.parse(localStorage.getItem(KEY));
    if (!s) { const o = JSON.parse(localStorage.getItem(OLD_KEY)); if (o && o.cards) s = {cards:o.cards, sessions:o.sessions||[], cfg:o.cfg||{}}; }
    if (s && s.cards) {
      const cfg = {...DEFAULT_CFG, ...(s.cfg||{})};
      if (!s.cfg || !s.cfg.vknown) { cfg.vverbs = [...new Set([...(cfg.vverbs||[]), ...DEFAULT_CFG.vverbs])]; }
      cfg.vknown = DEFAULT_CFG.vverbs.length;
      return {cards:s.cards, sessions:s.sessions||[], cfg};
    }
  }
  catch(e){ storageOK = false; }
  return {cards:{}, sessions:[], cfg:{...DEFAULT_CFG}};
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }
let S = load();

/* ---------- Leitner boxes ----------
   new card = box 0. "I knew that" moves it up one box (new → 2), max 5. "Still to learn" sends it to box 1.
   Smart mix draws cards with these weights, so box 1 comes up 16× as often as box 5. */
const WEIGHT = {0:6, 1:16, 2:8, 3:4, 4:2, 5:1};
const BOX_LABEL = ['new','box 1 · just missed','box 2','box 3','box 4','box 5 · well known'];
const boxOf = id => (S.cards[id] && S.cards[id].b) || 0;
function record(id, ok){
  const c = S.cards[id] || {b:0, n:0, ok:0, bad:0};
  c.n++; ok ? c.ok++ : c.bad++;
  c.b = ok ? Math.min(5, Math.max(1, c.b) + 1) : 1;
  c.t = Date.now();
  S.cards[id] = c; save();
}

/* ---------- Session setup ---------- */
function poolFor(cfg){
  return ALL.filter(c => {
    if (c.deck !== cfg.deck) return false;
    const b = boxOf(c.id);
    const fOK0 = cfg.focus==='mix' || (cfg.focus==='new' ? b===0 : (b>=1 && b<=2));
    if (c.deck === 'numbers') return (cfg.ngroup==='all' || c.n.group===cfg.ngroup) && fOK0;
    if (c.deck === 'special') return (cfg.swgroup === 'all' || c.kind === cfg.swgroup) && fOK0;
    if (c.deck === 'nouns' || c.deck === 'adj') return fOK0;
    if (c.deck === 'time') return (cfg.tgroup === 'all' || c.w.grp === cfg.tgroup) && fOK0;
    if (c.deck === 'verbs') {
      const part = {all:['pron','pat','prt','conj'], pronpat:['pron','pat','prt'], pron:['pron'], pat:['pat','prt'], conj:['conj'], read:['conj']}[cfg.vpart] || [];
      if (!part.includes(c.kind) || !fOK0) return false;
      if (c.kind === 'pat') return cfg.vtenses.includes(c.t);
      if (c.kind === 'conj') return cfg.vtenses.includes(c.t) && cfg.vverbs.includes(c.v) && cfg.vmodes.includes(c.m);
      return true;
    }
    const lOK = cfg.letters==='all' || (cfg.letters==='pick' ? cfg.picked.includes(c.L.id) : c.L.group===cfg.letters);
    const tOK = cfg.types==='AB' || c.opt===cfg.types;
    const fOK = cfg.focus==='mix' || (cfg.focus==='new' ? b===0 : (b>=1 && b<=2));
    return lOK && tOK && fOK;
  });
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function drawCards(cfg){
  const pool = poolFor(cfg), n = +cfg.len || pool.length;
  // weighted random order (Efraimidis–Spirakis), then take the first n
  const keyed = pool.map(c => ({c, k: Math.pow(Math.random(), 1 / WEIGHT[boxOf(c.id)])})).sort((a,b) => b.k - a.k);
  return shuffle(keyed.slice(0, n).map(x => x.c.id));
}

function renderSetup(){
  const cfg = S.cfg;
  for (const seg of document.querySelectorAll('#home .seg')) {
    const val = cfg[seg.dataset.key];
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', Array.isArray(val) ? val.includes(b.dataset.v) : b.dataset.v===String(val)));
  }
  const isNum = cfg.deck === 'numbers', isVerb = cfg.deck === 'verbs', isLet = cfg.deck === 'letters';
  const conj = isVerb && ['all','conj','read'].includes(cfg.vpart);
  $('fNum').hidden = !isNum; $('fLetters').hidden = !isLet; $('fTypes').hidden = !isLet;
  $('fSW').hidden = cfg.deck !== 'special';
  $('fTG').hidden = cfg.deck !== 'time';
  $('fVPart').hidden = !isVerb; $('fVTenses').hidden = !isVerb || cfg.vpart === 'pron';
  $('fVVerbs').hidden = !conj; $('fVModes').hidden = !conj; $('fVDir').hidden = !conj || cfg.vpart === 'read';   // "Verbs": always Arabic form → meaning
  $('picker').hidden = !isLet || cfg.letters !== 'pick';
  $('picker').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', cfg.picked.includes(b.dataset.id)));
  const n = poolFor(cfg).length, take = Math.min(n, +cfg.len || n);
  $('avail').textContent = n ? (isRU() ? `Подходит: ${n} ${ruPlural(n,'карточка','карточки','карточек')}` : `${n} cards match`)
    : t(cfg.focus==='learn' ? 'No cards in “still learning” yet' : cfg.focus==='new' ? 'No new cards left here' : (isNum ? 'No cards here' : 'Choose at least one letter'));
  $('startBtn').textContent = n ? (isRU() ? `Начать · ${take}` : `Start · ${take} cards`) : t('Start');
  $('startBtn').disabled = !n;
}
document.querySelectorAll('#home .seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = seg.dataset.key;
  if (seg.classList.contains('multi')) {           // toggle; keep at least one selected
    const arr = [...S.cfg[k]], i = arr.indexOf(b.dataset.v);
    if (i < 0) arr.push(b.dataset.v); else if (arr.length > 1) arr.splice(i, 1);
    S.cfg[k] = arr;
  } else S.cfg[k] = b.dataset.v;
  save();
  if (k === 'deck') renderHome(); else renderSetup();
}));
$('picker').innerHTML = DB.letters.map(L => `<button data-id="${L.id}" title="${L.name}">${L.char}</button>`).join('');
$('picker').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const p = S.cfg.picked, i = p.indexOf(b.dataset.id); i<0 ? p.push(b.dataset.id) : p.splice(i,1);
  save(); renderSetup();
});

/* ---------- Home: progress + history ---------- */
const BOXCOL = i => `var(--b${i})`;
function legendHTML(){ return [0,1,2,3,4,5].map(i => `<span><i style="background:${BOXCOL(i)}"></i>${t(BOX_LABEL[i])}</span>`).join(''); }
function renderHome(){
  applyLang();
  const deckCards = ALL.filter(c => c.deck === S.cfg.deck);
  const counts = [0,0,0,0,0,0]; deckCards.forEach(c => counts[boxOf(c.id)]++);
  $('progDeck').textContent = t({special:'special words', adj:'adjectives'}[S.cfg.deck] || S.cfg.deck);
  $('ovBtn').hidden = S.cfg.deck !== 'letters'; $('vtBtn').hidden = S.cfg.deck !== 'verbs';
  $('stKnown').textContent = counts[4] + counts[5];
  $('stLearn').textContent = counts[1] + counts[2] + counts[3];
  $('stNew').textContent = counts[0];
  $('boxbar').innerHTML = [1,2,3,4,5,0].map(i => counts[i] ? `<i style="width:${counts[i]/deckCards.length*100}%;background:${BOXCOL(i)}" title="${t(BOX_LABEL[i])}: ${counts[i]}"></i>` : '').join('');
  $('legend').innerHTML = legendHTML();
  const hs = S.sessions.slice(0, 6);
  $('histPanel').hidden = !hs.length;
  $('hist').innerHTML = hs.map(s => {
    const d = new Date(s.d);
    return `<li><span>${d.toLocaleDateString(undefined,{day:'numeric',month:'short'})} ${d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})} · ${s.label}</span><span class="r">${s.ok} ✓ · ${s.bad} ✗</span></li>`;
  }).join('');
  $('storeNote').textContent = t(storageOK ? 'Progress is saved in this browser on this device.' : 'This browser is not saving progress (private mode or blocked storage).');
  renderSetup();
}

/* ---------- Audio ---------- */
const player = new Audio(); let playingBtn = null, fallback = '', seq = [], gapTimer = null, cur = null;
const LEGACY_AUDIO = '../v2/audio/';   // letters + numbers audio is shared with v2 (no second copy needed)
const VOICE_ORDER = {both:['male','female'], male:['male'], female:['female']};   // male = Miro, female = Dii
const voicesFor = () => VOICE_ORDER[S.cfg.voice] || VOICE_ORDER.both;
function speak(text){
  if (!text || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ar-SA'; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function stopAudio(){
  clearTimeout(gapTimer); seq = []; player.pause();
  if (playingBtn) playingBtn.classList.remove('playing'); playingBtn = null;
}
/* rel = 'letters/<id>.mp3', 'words/<id>-<form>.mp3' or 'numbers/<key>.mp3'; plays male, pause (0.5 s letters, 0.4 s numbers), female (or one voice, per setting) */
/* partsFor(voice) -> list of files said one after another by that voice; then a pause before the next voice */
function playSeq(partsFor, text, btn, gap){
  stopAudio(); playingBtn = btn; fallback = text; btn && btn.classList.add('playing');
  for (const v of voicesFor()) { const ps = partsFor(v); ps.forEach((src, i) => seq.push({src, gap: i < ps.length - 1 ? 60 : (gap || 500)})); }
  playNext();
}
function play(rel, text, btn, gap){ playSeq(v => [`${LEGACY_AUDIO}${v}/${rel}`], text, btn, gap); }
function playVerb(a, hal, text, btn){
  playSeq(v => [...(hal ? [`audio/${VERBDB.halAudio[0]}/${v}/${VERBDB.halAudio[1]}`] : []), `audio/${a[0]}/${v}/${a[1]}`], text, btn, 500);
}
function playNext(){
  cur = seq.shift();
  if (!cur) { if (playingBtn) playingBtn.classList.remove('playing'); playingBtn = null; return; }
  player.src = cur.src; player.currentTime = 0;
  const p = player.play(); if (p && p.catch) p.catch(() => {});
}
player.addEventListener('ended', () => { if (seq.length) gapTimer = setTimeout(playNext, cur ? cur.gap : 500); else playNext(); });
player.addEventListener('error', () => { stopAudio(); speak(fallback); });
const letterSrc = L => `letters/${L.id}.mp3`;
const wordSrc = (L, f) => `words/${L.id}-${f}.mp3`;
const wordText = w => w.pre + w.t + w.post;

/* ---------- Card rendering ---------- */
const card = $('card'), front = $('front'), back = $('back');
/* shrink long numbers/names to fit their box; measures an inner inline-block so right-to-left text is measured correctly */
function fitText(root){
  const run = () => root.querySelectorAll('.fitme').forEach(el => {
    let fi = el.firstElementChild;
    if (!fi || !fi.classList.contains('fi')) { el.innerHTML = `<span class="fi">${el.innerHTML}</span>`; fi = el.firstElementChild; }
    el.style.fontSize = '';
    let s = parseFloat(getComputedStyle(el).fontSize);
    while (fi.getBoundingClientRect().width > el.clientWidth + 1 && s > 14) { s -= 2; el.style.fontSize = s + 'px'; } });
  run(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
}
const GENDER = {m:'masculine · мужской', f:'feminine · женский'};
function renderNumFront(c){
  const n = c.n;
  front.innerHTML = `<div class="front-main n-front">
      <div class="digits fitme">${toArabicDigits(n.value)}</div>
      <div class="name fitme">${n.forms[0].ar}</div></div>
    <button class="flipbtn" id="flipBtn" aria-label="Show the answer">${ICON.flip}</button>`;
  $('flipBtn').onclick = () => flip(true);
  fitText(front);
}
function renderNumBack(c){
  const n = c.n, single = n.forms.length === 1;
  back.innerHTML = `
    <div class="n-b1"><div class="n-num fitme"><span class="ard">${toArabicDigits(n.value)}</span><span class="lat">(${fmtNum(n.value)})</span></div></div>
    <div class="n-b2">
      <div class="n-forms">${n.forms.map(f => `
        <div class="n-form${single ? ' single' : ''}">
          ${f.g ? `<div class="g">${GENDER[f.g]}</div>` : ''}
          <div class="w fitme">${f.ar}</div>
          <div class="p"><b>${f.tr}</b><span class="sep">|</span>${f.ru}</div>
          <button class="snd" data-src="numbers/${numKey(n,f)}.mp3" data-text="${f.ar}" data-gap="400" aria-label="Play ${f.tr}">${ICON.speaker}</button>
        </div>`).join('')}</div>
      <div class="answer">
        <button class="abtn happy" data-ok="1" aria-label="I knew that">${ICON.happy}</button>
        <button class="abtn sad" data-ok="0" aria-label="I still have to learn it">${ICON.sad}</button>
      </div>
    </div>`;
  fitText(back);
}
function renderFront(c){
  if (c.deck === 'numbers') return renderNumFront(c);
  if (c.deck === 'verbs') return renderVFront(c);
  if (WDECKS.has(c.deck)) return renderWFront(c);
  const main = c.opt==='B' ? `<div class="f-name">${nameHTML(c.L)}</div>` : `<div class="ar f-glyph">${formGlyph(c.L, c.form)}</div>`;
  front.innerHTML = `<div class="front-main">${main}</div>
    <button class="flipbtn" id="flipBtn" aria-label="Show the answer">${ICON.flip}</button>`;
  $('flipBtn').onclick = () => flip(true);
}
function renderBack(c){
  back.classList.remove('vsolo', 'wprep');
  if (c.deck === 'numbers') return renderNumBack(c);
  if (c.deck === 'verbs') return renderVBack(c);
  if (WDECKS.has(c.deck)) return renderWBack(c);
  const cells = FORM_ORDER.map(f => isValid(c.L, f) ? `
    <div class="cell ${f===c.form?'on':''}"><div class="g ar">${formGlyph(c.L,f)}</div><div class="lb">${DB.forms[f].en}<br>${DB.forms[f].ru}</div></div>`
    : `<div class="cell empty"></div>`).join('');
  let main;
  if (c.opt==='A') {
    main = `<button class="snd s2" data-src="${wordSrc(c.L,c.form)}" data-text="${wordText(c.w)}" aria-label="Play the word">${ICON.speaker}</button>
      <div class="ar word">${joinedHTML(c.w.pre,c.w.t,c.w.post,'ctx','hl')}</div>
      ${prHTML(c.w)}<div class="en">${c.w.en}</div><div class="ru">${c.w.ru}</div>`;
  } else {
    main = `<div class="wgrid">${FORM_ORDER.filter(f => isValid(c.L,f) && c.L.words[f]).map(f => { const w=c.L.words[f]; return `
      <div class="wt">
        <button class="snd" data-src="${wordSrc(c.L,f)}" data-text="${wordText(w)}" aria-label="Play ${w.tr}">${ICON.speaker}</button>
        <div class="fl">${DB.forms[f].en} · ${DB.forms[f].ru}</div>
        <div class="ar word">${joinedHTML(w.pre,w.t,w.post,'ctx','hl')}</div>
        ${prHTML(w)}<div class="en">${w.en}</div><div class="ru">${w.ru}</div>
      </div>`; }).join('')}</div>`;
  }
  back.innerHTML = `
    <div class="b1">
      <button class="snd s1" data-src="${letterSrc(c.L)}" data-text="${c.L.char}" aria-label="Play the letter sound">${ICON.speaker}</button>
      <div class="b1-top"><span class="ar b1-letter">${c.L.char}</span><span class="b1-name">${nameHTML(c.L)}</span></div>
      <div class="cells">${cells}</div>
    </div>
    <div class="b2">
      <div class="b2-main">${main}</div>
      <div class="answer">
        <button class="abtn happy" data-ok="1" aria-label="I knew that">${ICON.happy}</button>
        <button class="abtn sad" data-ok="0" aria-label="I still have to learn it">${ICON.sad}</button>
      </div>
    </div>`;
}
back.addEventListener('click', e => {
  const snd = e.target.closest('.snd, .vrow, .prow');
  if (snd && snd.dataset.adir) { playVerb([snd.dataset.adir, snd.dataset.afile], snd.dataset.hal === '1', snd.dataset.text, snd); return; }
  if (snd && snd.dataset.src) { play(snd.dataset.src, snd.dataset.text, snd, +snd.dataset.gap || 500); return; }
  const ab = e.target.closest('.abtn'); if (ab) { answer(ab.dataset.ok==='1'); return; }
  flip(false);   // tap elsewhere on the answer side turns the card back
});
function flip(on){ card.classList.toggle('flipped', on===undefined ? !card.classList.contains('flipped') : on); }

/* ---------- Session flow ---------- */
let sess = null;
function startSession(ids, label){
  if (!ids.length) return;
  sess = {ids, i:0, ok:[], bad:[], label};
  showScreen('session'); showCard();
}
function showCard(){
  stopAudio();
  const inner = card.querySelector('.inner');
  inner.style.transition='none'; card.classList.remove('flipped'); void inner.offsetWidth; inner.style.transition='';
  const c = BYID[sess.ids[sess.i]];
  renderFront(c); renderBack(c);
  $('pfill').style.width = (sess.i / sess.ids.length * 100) + '%';
  $('pnum').textContent = `${sess.i + 1} / ${sess.ids.length}`;
  $('tH').innerHTML = ICON.happy + sess.ok.length; $('tS').innerHTML = ICON.sad + sess.bad.length;
}
function answer(ok){
  const id = sess.ids[sess.i];
  record(id, ok); (ok ? sess.ok : sess.bad).push(id);
  sess.i++;
  if (sess.i >= sess.ids.length) finish(); else showCard();
}
function finish(){
  stopAudio();
  const n = sess.ok.length + sess.bad.length;
  if (n) { S.sessions.unshift({d:Date.now(), label:sess.label, n, ok:sess.ok.length, bad:sess.bad.length}); S.sessions = S.sessions.slice(0,50); save(); }
  $('sumOk').textContent = sess.ok.length; $('sumBad').textContent = sess.bad.length;
  $('sumOkL').innerHTML = ' ' + ICON.happy.replace('<svg','<svg style="color:var(--happy)"') + ' ' + t('knew');
  $('sumBadL').innerHTML = ' ' + ICON.sad.replace('<svg','<svg style="color:var(--sad)"') + ' ' + t('to learn');
  $('sumMissPanel').hidden = !sess.bad.length; $('repeatBtn').hidden = !sess.bad.length;
  $('sumMiss').innerHTML = sess.bad.map(id => { const c = BYID[id];
    if (c.deck === 'numbers') return `<span class="chip lat">${toArabicDigits(c.n.value)} · ${fmtNum(c.n.value)}</span>`;
    if (c.deck === 'verbs') return `<span class="chip ar">${vChipText(c)}</span>`;
    if (WDECKS.has(c.deck)) return `<span class="chip ar">${c.w.ar}</span>`;
    return c.opt==='A' ? `<span class="chip ar">${formGlyph(c.L,c.form)}</span>` : `<span class="chip lat">${c.L.name}</span>`; }).join('');
  showScreen('summary');
}
function cfgLabel(cfg){
  const focus = cfg.focus === 'mix' ? '' : ', ' + t(cfg.focus === 'learn' ? 'still learning' : 'new');
  if (cfg.deck === 'special') return t('Special words') + ({all:'', q:' · ' + t('questions'), prep:' · ' + t('with/without/about/have')}[cfg.swgroup]) + focus;
  if (cfg.deck === 'nouns') return t('Nouns') + focus;
  if (cfg.deck === 'time') return t('Time') + ({all:'', day:' · ' + t('days of the week'), word:' · ' + t('day, month, year…')}[cfg.tgroup]) + focus;
  if (cfg.deck === 'adj') return t('Adjectives') + focus;
  if (cfg.deck === 'verbs') return t('Verbs') + ' · ' + t({all:'all', pronpat:'pronouns + patterns', pron:'pronouns', pat:'patterns', conj:'conjugation', read:'verbs (Arabic → meaning)'}[cfg.vpart]) + focus;
  if (cfg.deck === 'numbers') return t('Numbers') + (cfg.ngroup==='all' ? '' : ' ' + NUMDB.groups[cfg.ngroup]) + focus;
  const l = cfg.letters === 'pick' ? (isRU() ? `${cfg.picked.length} ${ruPlural(cfg.picked.length,'буква','буквы','букв')}` : `${cfg.picked.length} letters`) : t({all:'All letters', base:'Alphabet', variant:'Variants'}[cfg.letters]);
  const ty = {AB:'', A:', ' + t('forms'), B:', ' + t('names')}[cfg.types];
  return l + ty + focus;
}
$('startBtn').onclick = () => startSession(drawCards(S.cfg), cfgLabel(S.cfg));
$('endBtn').onclick = () => finish();
$('repeatBtn').onclick = () => startSession(shuffle([...sess.bad]), t('Mistakes again'));

  a.download = `arabic-cards-progress-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(t('Backup file saved'));
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d.cards !== 'object') throw new Error();
    S = {cards:d.cards, sessions:d.sessions||[], cfg:{...DEFAULT_CFG, ...(d.cfg||{})}}; save(); renderHome(); toast(t('Progress restored'));
  } catch(err) { toast(t('That file is not a progress backup')); }
};
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = t('Tap again to erase all progress');
    setTimeout(() => { b.classList.remove('confirm'); b.textContent = t('Reset progress'); }, 4000); return; }
  S = {cards:{}, sessions:[], cfg:S.cfg}; save(); b.classList.remove('confirm'); b.textContent = t('Reset progress'); renderHome(); toast(t('Progress erased'));
};

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if ($('session').hidden || /INPUT|SELECT/.test(e.target.tagName)) return;
  if (e.code==='Space') { e.preventDefault(); flip(); }
  if (card.classList.contains('flipped')) { if (e.key==='1') answer(true); if (e.key==='2') answer(false); }
});

/* ================= Verbs deck ================= */
const TL = t => `${VTENSE[t][0]} · ${VTENSE[t][1]}`;
/* coloured segments; zero-width joiners keep letters joined across colour changes */
function segHTML(segs, pronoun){
  const parts = segs.filter(s => s[1]);
  let html = pronoun ? `<span class="vpr">${pronoun}</span> ` : '';
  parts.forEach(([c, t], i) => {
    const prev = parts[i-1], next = parts[i+1];
    const jPrev = prev && !/\s$/.test(prev[1]) && joinsNext(base(prev[1], true)) && joinsPrev(base(t));
    const jNext = next && !/\s$/.test(t) && joinsNext(base(t, true)) && joinsPrev(base(next[1]));
    html += `<span class="${c === 'rt' ? 'vrt' : 'vaf'}">${jPrev ? ZWJ : ''}${t}${jNext ? ZWJ : ''}</span>`;
  });
  return html;
}
const vForm = c => VBYID[c.v].forms[c.t][c.m][c.p];
const baseLine = v => { const h = v.forms.past.pos.huwa;
  return `<div class="vbase"><span class="k">base form</span><span class="ar">${h.segs.map(s => s[1]).join('')}</span>(${h.lat.replace(/^huwa /, '')})</div>`; };
const qMark = m => m === 'q' ? '؟' : '';
const verbOnly = f => f.segs;   // segments of the verb (incl. particles), without the pronoun
function patHTML(pt){ return `${pt.pre ? `<span class="vaf">${pt.pre}</span>` : ''}<span class="vph">◌◌◌</span><span class="vaf">${pt.end}</span>`; }
function sndAttrs(a, hal, text){ return `data-adir="${a[0]}" data-afile="${a[1]}" data-hal="${hal ? 1 : 0}" data-text="${text}"`; }
const answerHTML = () => `<div class="answer">
    <button class="abtn happy" data-ok="1" aria-label="I knew that">${ICON.happy}</button>
    <button class="abtn sad" data-ok="0" aria-label="I still have to learn it">${ICON.sad}</button></div>`;
function vChipText(c){
  if (c.kind === 'pron') return PRON[c.p].ar;
  if (c.kind === 'pat') return `${PRON[c.p].ar} · ${VTENSE[c.t][0]}`;
  if (c.kind === 'prt') return c.x.ar;
  const f = vForm(c); return f.segs.map(s => s[1]).join('') + qMark(c.m);
}
function cardDir(c){
  if (c.kind !== 'conj') return 'produce';
  if (S.cfg.vpart === 'read') return 'recognise';
  sess.dirs = sess.dirs || {};
  if (!sess.dirs[sess.i]) sess.dirs[sess.i] = S.cfg.vdir === 'mix' ? (Math.random() < .5 ? 'produce' : 'recognise') : S.cfg.vdir;
  return sess.dirs[sess.i];
}
function renderVFront(c){
  let main = '';
  if (c.kind === 'pron') main = `<div class="big fitme">${PRON[c.p].ar}</div>`;
  else if (c.kind === 'pat') main = `<div class="lbl">pattern</div><div class="big fitme">${PRON[c.p].ar}</div><div class="lbl">${TL(c.t)}</div>`;
  else if (c.kind === 'prt') main = `<div class="lbl">particle</div><div class="big fitme">${c.x.ar}</div>`;
  else {
    const v = VBYID[c.v], f = vForm(c);
    if (cardDir(c) === 'produce') main = `<div class="lbl">${TL(c.t)}</div><span class="modechip">${VMODE[c.m][0]}</span>
        <div class="mid fitme">${PRON[c.p].ar}</div><div class="dict fitme">${v.dict}</div><div class="mean">${v.ru} · ${v.en}</div>`;
    else main = `<div class="lbl">what does it mean?</div><div class="mid fitme">${f.segs.map(s => s[1]).join('')}${qMark(c.m)}</div>`;
  }
  front.innerHTML = `<div class="front-main v-front">${main}</div>
    <button class="flipbtn" id="flipBtn" aria-label="Show the answer">${ICON.flip}</button>`;
  $('flipBtn').onclick = () => flip(true);
  fitText(front);
}
function tableRows(rowsFor, current){
  return VP.map(p => { const r = rowsFor(p);
    return `<button class="vrow${r.lat ? ' wl' : ''}${p === current ? ' on' : ''}" ${r.attrs || ''}><span class="rp">${PRON[p].ar}</span><span class="rf fitme">${r.html}</span>${r.lat ? `<span class="rl">${r.lat}</span>` : ''}</button>`; }).join('');
}
function renderVBack(c){
  let b1 = '', b2 = '';
  back.classList.remove('vsolo', 'wprep');
  if (c.kind === 'pron') {   // pronoun: one centred section (no table), buttons at the bottom
    const p = PRON[c.p];
    back.classList.add('vsolo');
    back.innerHTML = `<div class="v-solo">
        <button class="snd" ${sndAttrs(p.audio, false, p.ar)} aria-label="Play">${ICON.speaker}</button>
        <div class="lbl">pronoun</div>
        <div class="ph fitme"><span class="vrt">${p.ar}</span></div>
        <div class="tl"><b>${p.lat}</b><span class="sep">|</span>${p.rus}</div>
        <div class="mru">${p.ru}</div><div class="men">${p.en}</div>
      </div><div class="v-b2 solo">${answerHTML()}</div>`;
    fitText(back); return;
  } else if (c.kind === 'pat') {
    const pt = VERBDB.patterns[c.t][c.p], ex = VBYID.katab.forms[c.t].pos[c.p];
    b1 = `<div class="lbl">${PRON[c.p].ar} · ${TL(c.t)}</div><div class="ph fitme">${patHTML(pt)}</div>
      <div class="tl"><b>${pt.lat}</b><span class="sep">|</span>${pt.rus}</div>
      <div class="exar">${segHTML(ex.segs, PRON[c.p].ar)}</div><div class="tr">${ex.lat} · ${ex.rus}</div>
      <button class="snd" ${sndAttrs(ex.audio, false, ex.phrase)} aria-label="Play the example">${ICON.speaker}</button>`;
    b2 = `<div class="v-tab">${tableRows(p => ({html: patHTML(VERBDB.patterns[c.t][p])}), c.p)}</div>`;
  } else if (c.kind === 'prt') {
    const x = c.x, [vid, t, m, p] = x.ex, ex = VBYID[vid].forms[t][m][p];
    b1 = `<div class="lbl">particle</div><div class="ph fitme"><span class="vaf">${x.ar}</span></div>
      <div class="tl"><b>${x.lat}</b><span class="sep">|</span>${x.rus}</div><div class="tr">${x.ru} · ${x.en}</div>`;
    b2 = `<div class="v-tab"><div class="v-rule">${x.rule_ru}<span class="en">${x.rule_en}</span></div>
      <div class="v-ex"><div class="ph fitme">${m === 'q' ? `<span class="vaf">${ex.segs[0][1]}</span>${segHTML(ex.segs.slice(1), PRON[p].ar)}` : segHTML(ex.segs, PRON[p].ar)}${qMark(m)}</div>
        <div class="tl lt">${ex.lat}</div><div class="tl rs">${ex.rus}</div><div class="tr">${ex.ru} · ${ex.en}</div>
        <button class="snd" ${sndAttrs(ex.audio, ex.hal, ex.phrase)} aria-label="Play the example">${ICON.speaker}</button></div></div>`;
  } else {
    const v = VBYID[c.v], f = vForm(c);
    const ph = c.m === 'q' ? `<span class="vaf">${f.segs[0][1]}</span>${segHTML(f.segs.slice(1), PRON[c.p].ar)}` : segHTML(f.segs, PRON[c.p].ar);
    b1 = `<div class="lbl">${TL(c.t)} · ${VMODE[c.m][0]} ${VMODE[c.m][1]}</div><div class="ph fitme">${ph}${qMark(c.m)}</div>
      <div class="tl lt">${f.lat}</div><div class="tl rs">${f.rus}</div><div class="tr">${f.ru} · ${f.en}</div>
      <button class="snd" ${sndAttrs(f.audio, f.hal, f.phrase)} aria-label="Play">${ICON.speaker}</button>`;
    b2 = `<div class="v-tab">${baseLine(v)}${tableRows(p => { const g = v.forms[c.t][c.m][p];
      return {html: segHTML(g.segs) + qMark(c.m), lat: g.lat, attrs: sndAttrs(g.audio, g.hal, g.phrase)}; }, c.p)}</div>`;
  }
  back.innerHTML = `<div class="v-b1">${b1}</div><div class="v-b2">${b2}${answerHTML()}</div>`;
  fitText(back);
}

/* ---------- Verb tables (reference) ---------- */
let vtVerb = VERBDB.verbs[0].id, vtMode = 'pos';
function renderVTables(){
  const v = VBYID[vtVerb];
  $('vtVerb').innerHTML = VERBDB.verbs.map(x => `<button data-v="${x.id}" aria-pressed="${x.id === vtVerb}"><span class="ar" style="font-family:var(--ar);font-size:17px">${x.dict.split(' – ')[0]}</span> ${x.en.replace('to ','')}</button>`).join('');
  $('vtMode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === vtMode));
  $('vtMean').innerHTML = `<span style="font-family:var(--ar);font-size:20px">${v.dict}</span> · ${v.dictLat} · ${v.ru} · ${v.en}`;
  $('vtBody').innerHTML = Object.keys(VTENSE).map(t => `<section class="vt-sec"><h3>${TL(t)}</h3>${
    tableRows(p => { const g = v.forms[t][vtMode][p]; return {html: segHTML(g.segs) + qMark(vtMode), lat: g.lat, attrs: sndAttrs(g.audio, g.hal, g.phrase)}; }, null)}</section>`).join('');
  fitText($('vtBody'));
}
$('vtBtn').onclick = () => { showScreen('vtables'); renderVTables(); };
$('vtBack').onclick = () => { stopAudio(); renderHome(); showScreen('home'); };
$('vtVerb').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { vtVerb = b.dataset.v; renderVTables(); } });
$('vtMode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { vtMode = b.dataset.v; renderVTables(); } });
$('vtBody').addEventListener('click', e => { const r = e.target.closest('.vrow'); if (r) playVerb([r.dataset.adir, r.dataset.afile], r.dataset.hal === '1', r.dataset.text, r); });

/* ================= Special words + nouns ================= */
/* split a personal form into stem + ending at a letter boundary: مَعِ|ي، مَعَ|كَ، عَ|نِّي، بِدُونِ|نَا، لَدَيْ|كَ، لَدَ|يَّ */
const PREP_STEM = {lada:'لَدَيْ'};
const units = s => { const u=[]; for (const ch of s) { if (MARKS.test(ch) && u.length) u[u.length-1]+=ch; else u.push(ch); } return u; };
function prepSegs(p, form){
  const st = units(PREP_STEM[p.id] || p.ar), fu = units(form);
  let k = 0; while (k < st.length && k < fu.length && base(st[k]) === base(fu[k])) k++;
  if (k >= fu.length) k = fu.length - 1;
  if (k > 0 && fu[k-1].includes('\u0651') && !(st[k-1]||'').includes('\u0651')) k--;   // عَنْ + نِي → عَ|نِّي (doubled n belongs to the ending)
  return [['rt', fu.slice(0,k).join('')], ['af', fu.slice(k).join('')]];
}
const qMarkAll = ar => ar.split(' / ').map(x => x + '؟').join(' / ');
function renderWFront(c){
  const w = c.w, big = c.kind === 'q' ? qMarkAll(w.ar) : w.ar;
  const lbl = {q:'question word', prep:'preposition', noun:'noun', time: w.grp === 'day' ? 'day of the week' : 'time', adj:'adjective'}[c.kind];
  front.innerHTML = `<div class="front-main v-front"><div class="lbl">${lbl}</div><div class="big fitme">${big}</div></div>
    <button class="flipbtn" id="flipBtn" aria-label="Show the answer">${ICON.flip}</button>`;
  $('flipBtn').onclick = () => flip(true);
  fitText(front);
}
function renderWBack(c){
  const w = c.w;
  back.classList.remove('vsolo');
  back.classList.toggle('wprep', c.kind === 'prep');
  if (c.kind === 'noun' || c.kind === 'time') {   // one centred section, like the pronoun cards
    back.classList.add('vsolo');
    back.innerHTML = `<div class="v-solo">
        <button class="snd" ${sndAttrs(w.audio, false, w.ar)} aria-label="Play">${ICON.speaker}</button>
        <div class="lbl">${c.kind === 'noun' ? 'noun' : w.grp === 'day' ? 'day of the week' : 'time'}</div>
        <div class="ph fitme"><span class="vrt">${w.ar}</span></div>
        <div class="tl"><b class="nw">${w.lat}</b><span class="sep">|</span><span class="nw">${w.rus}</span></div>
        <div class="mru">${w.ru}</div><div class="men">${w.en}</div>
      </div><div class="v-b2 solo">${answerHTML()}</div>`;
    fitText(back); return;
  }
  const b1 = `<div class="w-b1"><div class="lbl">${{q:'question word', prep:'preposition', adj:'adjective'}[c.kind]}</div>
      <div class="wd fitme">${c.kind === 'q' ? qMarkAll(w.ar) : w.ar}</div>
      <div class="tl"><b>${w.lat}</b><span class="sep">|</span>${w.rus}</div>
      <div class="tr">${w.ru} · ${w.en}</div>
      <button class="snd" ${sndAttrs(w.audio, false, w.ar)} aria-label="Play">${ICON.speaker}</button></div>`;
  let b2;
  if (c.kind === 'q') {
    const x = w.ex;
    b2 = `<div class="w-ex"><div class="lbl">example</div>
      <div class="sent fitme">${x.pre}<span class="hw">${x.w}</span>${x.post}</div>
      <div class="tl"><b>${x.lat}</b></div><div class="tl rs">${x.rus}</div>
      <div class="tr">${x.ru} · ${x.en}</div>
      <button class="snd" ${sndAttrs(x.audio, false, x.pre + x.w + x.post)} aria-label="Play the example">${ICON.speaker}</button></div>`;
  } else if (c.kind === 'adj') {   // comparative + superlative, the أَفْعَل pattern's prefix in green
    const row = (f, pre, lb) => `<button class="prow arow" ${sndAttrs(f.audio, false, f.ar)}>
        <span class="pa fitme">${segHTML([['af', pre], ['rt', f.ar.slice(pre.length)]])}</span>
        <span class="pt"><span class="k">${lb}</span><br><span class="m">${f.ru} · ${f.en}</span><br><span class="t">${f.lat} | ${f.rus}</span></span></button>`;
    b2 = `<div class="v-tab">${row(w.comp, 'أَ', 'comparative · сравн.')}${row(w.sup, 'الأَ', 'superlative · превосх.')}</div>`;
  } else {
    b2 = `<div class="v-tab">${w.forms.map(f => `<button class="prow" ${sndAttrs(f.audio, false, f.ar)}>
        <span class="pa fitme">${segHTML(prepSegs(w, f.ar))}</span>
        <span class="pt"><span class="m">${f.ru} · ${f.en}</span><br><span class="t">${f.lat} | ${f.rus}</span></span></button>`).join('')}</div>`;
  }
  back.innerHTML = `${b1}<div class="v-b2">${b2}${answerHTML()}</div>`;
  fitText(back);
}

renderHome();
</script>
