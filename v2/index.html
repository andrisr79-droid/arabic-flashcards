  /* Layout: one centred column (home, session, summary, overview screens); the card keeps the v1 design. */
  :root{
    --bg:#f3eee4; --card:#fffdf8; --ink:#1f2a2e; --ink-soft:#5d686c; --ink-faint:#b9b2a5; --line:#1f2a2e;
    --surface:#ffffff; --border:#e6dfd2; --border-strong:#d6cfc2; --ru:#33454b; --shadow:rgba(60,40,10,.10);
    --hl-bg:#dcf2df; --hl-border:#7cc48d;   /* light green: highlighted form cell */
    --hl-letter:#2fa356;                     /* lighter green: letter inside words */
    --flip:#1f6b3a; --flip-d:#17542d;       /* dark green flip button */
    --happy:#34a35a; --happy-d:#2a8a4b;     /* "I knew that" */
    --sad:#ec7a72; --sad-d:#dd625a;         /* light red: "still to learn" */
    --b0:#d9d3c7; --b1:#ec7a72; --b2:#f2a65a; --b3:#e9cf5b; --b4:#9fd18a; --b5:#34a35a;  /* Leitner boxes */
    --primary:#1f2a2e; --primary-fg:#ffffff;
    --start:#16a34a; --start-d:#128a3e; --start-fg:#ffffff;   /* bright green Start button */
    --ar:"Noto Naskh Arabic Local","Noto Naskh Arabic","Geeza Pro","Arabic Typesetting","Traditional Arabic",serif;
    --ui:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#15191b; --card:#20272a; --ink:#e9e5dd; --ink-soft:#a4adb0; --ink-faint:#5f686b; --line:#e9e5dd;
    --surface:#283033; --border:#354044; --border-strong:#46524f; --ru:#c3ced1; --shadow:rgba(0,0,0,.45);
    --hl-bg:#1d3a26; --hl-border:#4f9a63; --hl-letter:#7fe0a0;
    --flip:#2f8a50; --flip-d:#27744a; --happy:#3aa862; --happy-d:#2f8f53; --sad:#e2716a; --sad-d:#cc5e57;
    --b0:#3a4346; --b1:#c95c55; --b2:#c98a45; --b3:#bfa640; --b4:#6fa860; --b5:#3aa862;
    --primary:#e9e5dd; --primary-fg:#15191b; --start:#22c55e; --start-d:#1fb055; --start-fg:#0b1f12; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#15191b; --card:#20272a; --ink:#e9e5dd; --ink-soft:#a4adb0; --ink-faint:#5f686b; --line:#e9e5dd;
    --surface:#283033; --border:#354044; --border-strong:#46524f; --ru:#c3ced1; --shadow:rgba(0,0,0,.45);
    --hl-bg:#1d3a26; --hl-border:#4f9a63; --hl-letter:#7fe0a0;
    --flip:#2f8a50; --flip-d:#27744a; --happy:#3aa862; --happy-d:#2f8f53; --sad:#e2716a; --sad-d:#cc5e57;
    --b0:#3a4346; --b1:#c95c55; --b2:#c98a45; --b3:#bfa640; --b4:#6fa860; --b5:#3aa862;
    --primary:#e9e5dd; --primary-fg:#15191b; --start:#22c55e; --start-d:#1fb055; --start-fg:#0b1f12; color-scheme:dark }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);min-height:100vh;font-size:15px;
       padding-top:max(14px, env(safe-area-inset-top, 0px));padding-bottom:max(20px, env(safe-area-inset-bottom, 0px));
       padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  [hidden]{display:none!important}
  .wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
  .hl{font-weight:700;color:var(--hl-letter)}
  .ctx{font-weight:400}
  .t{color:var(--ink-faint);font-weight:400}
  .l{font-weight:700;color:var(--ink)}
  button{font:inherit;color:inherit}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--hl-border);outline-offset:2px}
  .btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:14px}
  .btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:600}
  #startBtn{background:var(--start);border-color:var(--start);color:var(--start-fg);font-size:16px;padding:12px 20px}
  #startBtn:hover{background:var(--start-d);border-color:var(--start-d)}
  #startBtn:disabled{opacity:.45;cursor:not-allowed}
  .btn.small{padding:6px 10px;font-size:13px}
  .linkbtn{background:none;border:0;padding:4px 0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:13px}
  h1{font-size:20px;margin:4px 0 0;text-align:center}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 8px;font-weight:600}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
  .muted{color:var(--ink-soft);font-size:13px}

  /* home: progress */
  .stats{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
  .stat{flex:1;text-align:center}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--ink-soft)}
  .boxbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--b0)}
  .boxbar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

  /* home: setup */
  .field{margin-bottom:12px}
  .field>label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{padding:7px 11px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:13.5px}
  .seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
  .picker{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
  .picker button{aspect-ratio:1;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-family:var(--ar);font-size:20px;line-height:1;padding:0}
  .picker button[aria-pressed="true"]{background:var(--hl-bg);border-color:var(--hl-border);font-weight:700}
  .startrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .hist{list-style:none;margin:0;padding:0;font-size:13.5px}
  .hist li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
  .hist li:first-child{border-top:0}
  .hist .r{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tools{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}

  /* session bar */
  .sbar{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;margin:0 auto 10px}
  .prog{flex:1}
  .prog .track{height:6px;border-radius:3px;background:var(--b0);overflow:hidden}
  .prog .fill{height:100%;background:var(--hl-letter);width:0;transition:width .25s}
  .prog .num{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
  .tally{display:flex;gap:8px;font-size:13px;font-variant-numeric:tabular-nums;align-items:center}
  .tally span{display:flex;align-items:center;gap:3px}
  .tally svg{width:16px;height:16px}
  .tally .h{color:var(--happy)} .tally .s{color:var(--sad)}

  /* card */
  .stage{perspective:1400px;display:flex;justify-content:center}
  .card{width:min(360px,100%);height:600px;height:clamp(520px, calc(100svh - 120px), 640px);position:relative}
  .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);
        border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px var(--shadow);overflow:hidden}
  .back{transform:rotateY(180deg)}
  .front{display:flex;flex-direction:column;align-items:center;padding:28px 20px 26px}
  .front-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
  .f-glyph{font-size:140px;line-height:1.35}
  .name-lat{font-weight:700} .name-ru{font-weight:400;color:var(--ink-soft)}
  .f-name{text-align:center}
  .f-name .name-lat{font-size:54px;line-height:1.15;display:block}
  .f-name .name-ru{font-size:28px;line-height:1.3;display:block}
  .flipbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--flip);color:#fff;cursor:pointer;display:grid;place-items:center;
           box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .flipbtn:hover{background:var(--flip-d)} .flipbtn svg{width:30px;height:30px}
  .flipbtn:active,.abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}

  .back{display:grid;grid-template-rows:1fr 2fr}
  .b1{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px 12px;border-bottom:3px solid var(--line)}
  .b1-top{display:flex;align-items:center;justify-content:center;gap:12px}
  .b1-letter{font-size:56px;line-height:1.15;font-weight:700}
  .b1-name{display:flex;flex-direction:column;line-height:1.2}
  .b1-name .name-lat{font-size:18px} .b1-name .name-ru{font-size:14px}
  .cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .cell{border:1px solid var(--border);border-radius:9px;text-align:center;padding:2px 0 4px;background:var(--surface);min-height:72px}
  .cell.empty{background:transparent;border:1px dashed var(--border)}
  .cell .g{font-size:30px;line-height:1.45;direction:rtl}
  .cell .lb{font-size:9.5px;color:var(--ink-soft);line-height:1.25}
  .cell.on{background:var(--hl-bg);border:2px solid var(--hl-border)}
  .cell.on .lb{color:var(--ink);font-weight:600}
  .b2{position:relative;display:flex;flex-direction:column;padding:12px 14px 14px;text-align:center;min-height:0}
  .b2-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
  .word{font-size:72px;line-height:1.45;color:var(--ink)}
  .pr{margin-top:2px;line-height:1.3}
  .pr .p-lat{font-size:16px;font-weight:700} .pr .p-ru{font-size:14px;color:var(--ink-soft)}
  .en,.ru{font-size:20px;line-height:1.35} .en{margin-top:10px} .ru{color:var(--ru)}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
  .wt{position:relative;border:1px solid var(--border);border-radius:10px;padding:3px 4px 6px;background:var(--surface)}
  .wt:only-child{grid-column:1/-1}
  .wt .word{font-size:32px;line-height:1.45}
  .wt .p-lat{font-size:12.5px} .wt .p-ru{font-size:11.5px}
  .wt .en,.wt .ru{font-size:12.5px;line-height:1.3} .wt .en{margin-top:3px}
  .wt .fl{font-size:8.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;padding:2px 30px 0;line-height:1.25;min-height:22px;display:flex;align-items:center;justify-content:center}
  .answer{display:flex;gap:14px;justify-content:center;padding-top:10px}
  .abtn{width:84px;height:54px;border-radius:14px;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .abtn svg{width:32px;height:32px}
  .happy{background:var(--happy)} .happy:hover{background:var(--happy-d)}
  .sad{background:var(--sad)} .sad:hover{background:var(--sad-d)}
  .snd{position:absolute;width:34px;height:34px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);
       display:grid;place-items:center;color:var(--ink-soft);cursor:pointer;padding:0}
  .snd svg{width:17px;height:17px}
  .snd.playing{color:var(--hl-letter);border-color:var(--hl-border)}
  .s1{right:10px;top:10px} .s2{right:12px;top:12px}
  .wt .snd{width:26px;height:26px;right:4px;top:4px} .wt .snd svg{width:13px;height:13px}

  /* summary / overview */
  .big{display:flex;justify-content:center;gap:28px;margin:6px 0 4px}
  .big div{text-align:center} .big b{display:block;font-size:34px;font-variant-numeric:tabular-nums}
  .big svg{width:22px;height:22px;vertical-align:-4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:2px 10px;font-size:26px;line-height:1.5}
  .chip.lat{font-family:var(--ui);font-size:14px;line-height:2.6;font-weight:600}
  .ov{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ovt{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:4px 4px 6px;text-align:center}
  .ovt .ar{font-size:30px;line-height:1.4}
  .ovt .dots{display:flex;gap:3px;justify-content:center}
  .ovt .dots i{width:12px;height:8px;border-radius:2px;background:var(--b0)}
  .ovt .dots i.na{background:transparent;border:1px dashed var(--border)}
  .ovt .dots i.bb{width:8px;border-radius:50%;margin-left:3px}
  .ovt .nm{font-size:10.5px;color:var(--ink-soft)}
  .confirm{color:var(--sad-d);font-weight:600}
  .toast{position:fixed;left:50%;bottom:max(20px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--primary);color:var(--primary-fg);
         padding:9px 16px;border-radius:10px;font-size:14px;z-index:5}

  @media (max-height:700px){
    .f-glyph{font-size:118px} .word{font-size:60px} .en{margin-top:6px}
    .b1{padding-top:10px} .b1-letter{font-size:46px} .cell{min-height:64px} .cell .g{font-size:26px}
    .wt .word{font-size:28px;line-height:1.4} .wt .en,.wt .ru{font-size:11.5px}
  }
  @media (prefers-reduced-motion: reduce){.inner,.prog .fill{transition:none}}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<main class="wrap" id="home">
  <h1>Arabic Letter Cards</h1>

  <section class="panel" aria-labelledby="h-progress">
    <h2 id="h-progress">Your progress</h2>
    <div class="stats">
      <div class="stat"><b id="stKnown">0</b><span>known</span></div>
      <div class="stat"><b id="stLearn">0</b><span>still learning</span></div>
      <div class="stat"><b id="stNew">0</b><span>new</span></div>
    </div>
    <div class="boxbar" id="boxbar"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel" aria-labelledby="h-setup">
    <h2 id="h-setup">New session</h2>
    <div class="field"><label>Letters</label>
      <div class="seg" id="cfgLetters" data-key="letters">
        <button data-v="all">All</button><button data-v="base">Alphabet</button><button data-v="variant">ء ة ى لا</button><button data-v="pick">Choose…</button>
      </div>
      <div class="picker" id="picker" hidden></div>
    </div>
    <div class="field"><label>Cards</label>
      <div class="seg" id="cfgTypes" data-key="types">
        <button data-v="AB">Forms + names</button><button data-v="A">Letter forms</button><button data-v="B">Letter names</button>
      </div>
    </div>
    <div class="field"><label>Focus</label>
      <div class="seg" id="cfgFocus" data-key="focus">
        <button data-v="mix">Smart mix</button><button data-v="learn">Still learning</button><button data-v="new">New only</button>
      </div>
    </div>
    <div class="field"><label>Length</label>
      <div class="seg" id="cfgLen" data-key="len">
        <button data-v="10">10</button><button data-v="20">20</button><button data-v="40">40</button><button data-v="0">All</button>
      </div>
    </div>
    <div class="field"><label>Pronunciation</label>
      <div class="seg" id="cfgVoice" data-key="voice">
        <button data-v="both">Male + female</button><button data-v="male">Male</button><button data-v="female">Female</button>
      </div>
    </div>
    <div class="startrow">
      <span class="muted" id="avail"></span>
      <button class="btn primary" id="startBtn">Start</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-hist" id="histPanel">
    <h2 id="h-hist">Recent sessions</h2>
    <ul class="hist" id="hist"></ul>
  </section>

  <div class="tools">
    <button class="linkbtn" id="ovBtn">Letter overview</button>
    <button class="linkbtn" id="exportBtn">Save backup</button>
    <button class="linkbtn" id="importBtn">Restore backup</button>
    <button class="linkbtn" id="resetBtn">Reset progress</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <p class="muted" style="text-align:center;margin:0" id="storeNote"></p>
</main>

<!-- ============ SESSION ============ -->
<main id="session" hidden>
  <div class="sbar">
    <button class="btn small" id="endBtn">End</button>
    <div class="prog"><div class="track"><div class="fill" id="pfill"></div></div><div class="num" id="pnum"></div></div>
    <div class="tally"><span class="h" id="tH"></span><span class="s" id="tS"></span></div>
  </div>
  <div class="stage">
    <div class="card" id="card">
      <div class="inner">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
  </div>
</main>

<!-- ============ SUMMARY ============ -->
<main class="wrap" id="summary" hidden>
  <h1>Session complete</h1>
  <section class="panel">
    <div class="big">
      <div><b id="sumOk">0</b><span class="muted" id="sumOkL"></span></div>
      <div><b id="sumBad">0</b><span class="muted" id="sumBadL"></span></div>
    </div>
  </section>
  <section class="panel" id="sumMissPanel">
    <h2>Still to learn</h2>
    <div class="chips" id="sumMiss"></div>
  </section>
  <div class="startrow" style="justify-content:center;gap:10px;flex-wrap:wrap">
    <button class="btn primary" id="repeatBtn">Repeat my mistakes</button>
    <button class="btn" id="homeBtn">Home</button>
  </div>
</main>

<!-- ============ OVERVIEW ============ -->
<main class="wrap" id="overview" hidden>
  <h1>Letter overview</h1>
  <p class="muted" style="text-align:center;margin:0">Each bar is one form (isolated, initial, medial, final); the dot is the name card.</p>
  <div class="legend" id="legend2" style="justify-content:center"></div>
  <div class="ov" id="ov"></div>
  <div style="text-align:center"><button class="btn" id="ovBack">Home</button></div>
</main>

<div class="toast" id="toast" hidden></div>

const $ = id => document.getElementById(id);

/* ---------- Arabic joining helpers ---------- */
const MARKS = /[ً-ٰٟ]/;
const NO_NEXT = new Set([...'اأإآٱدذرزوؤةىء']);
const isAr = c => /[ؠ-يٱ-ۓـ]/.test(c);
const base = (s, fromEnd) => { const a=[...s]; if(fromEnd) a.reverse(); return a.find(c=>!MARKS.test(c)) || ''; };
const joinsNext = c => isAr(c) && !NO_NEXT.has(c);
const joinsPrev = c => isAr(c) && c !== 'ء';
function joinedHTML(pre, t, post, clsCtx, clsT){
  const j1 = pre  && joinsNext(base(pre,true)) && joinsPrev(base(t));
  const j2 = post && joinsNext(base(t,true))   && joinsPrev(base(post));
  return (pre ? `<span class="${clsCtx}">${pre}${j1?ZWJ:''}</span>` : '') +
         `<span class="${clsT}">${j1?ZWJ:''}${t}${j2?ZWJ:''}</span>` +
         (post ? `<span class="${clsCtx}">${j2?ZWJ:''}${post}</span>` : '');
}
const isValid = (L,f) => f==='isolated' || (f==='initial'&&L.connectsNext) || (f==='medial'&&L.connectsNext&&L.connectsPrev) || (f==='final'&&L.connectsPrev);
function formGlyph(L, form){
  const p = { isolated:['',L.char,''], initial:['',L.char,TAT], medial:[TAT,L.char,TAT], final:[TAT,L.char,''] }[form];
  return joinedHTML(p[0], p[1], p[2], 't', 'l');
}
const nameHTML = L => `<span class="name-lat">${L.name}</span><span class="name-ru">${L.nameRu}</span>`;
const prHTML = w => `<div class="pr"><div class="p-lat">${w.tr}</div><div class="p-ru">${w.trRu}</div></div>`;

/* ---------- Cards ---------- */
const ALL = [];
for (const L of DB.letters) {
  for (const form of FORM_ORDER) if (isValid(L,form) && L.words[form]) ALL.push({id:`${L.id}-${form}-A`, L, form, w:L.words[form], opt:'A'});
  ALL.push({id:`${L.id}-B`, L, form:null, opt:'B'});
}
const BYID = Object.fromEntries(ALL.map(c => [c.id, c]));

/* ---------- Storage (this browser only) ---------- */
const KEY = 'arabicLetterCards.v2';
const DEFAULT_CFG = {letters:'all', picked:[], types:'AB', focus:'mix', len:'20', voice:'both'};
let storageOK = true;
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.cards) return {cards:s.cards, sessions:s.sessions||[], cfg:{...DEFAULT_CFG, ...(s.cfg||{})}}; }
  catch(e){ storageOK = false; }
  return {cards:{}, sessions:[], cfg:{...DEFAULT_CFG}};
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }
let S = load();

/* ---------- Leitner boxes ----------
   new card = box 0. "I knew that" moves it up one box (new → 2), max 5. "Still to learn" sends it to box 1.
   Smart mix draws cards with these weights, so box 1 comes up 16× as often as box 5. */
const WEIGHT = {0:6, 1:16, 2:8, 3:4, 4:2, 5:1};
const BOX_LABEL = ['new','box 1 · just missed','box 2','box 3','box 4','box 5 · well known'];
const boxOf = id => (S.cards[id] && S.cards[id].b) || 0;
function record(id, ok){
  const c = S.cards[id] || {b:0, n:0, ok:0, bad:0};
  c.n++; ok ? c.ok++ : c.bad++;
  c.b = ok ? Math.min(5, Math.max(1, c.b) + 1) : 1;
  c.t = Date.now();
  S.cards[id] = c; save();
}

/* ---------- Session setup ---------- */
function poolFor(cfg){
  return ALL.filter(c => {
    const lOK = cfg.letters==='all' || (cfg.letters==='pick' ? cfg.picked.includes(c.L.id) : c.L.group===cfg.letters);
    const tOK = cfg.types==='AB' || c.opt===cfg.types;
    const b = boxOf(c.id);
    const fOK = cfg.focus==='mix' || (cfg.focus==='new' ? b===0 : (b>=1 && b<=2));
    return lOK && tOK && fOK;
  });
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function drawCards(cfg){
  const pool = poolFor(cfg), n = +cfg.len || pool.length;
  // weighted random order (Efraimidis–Spirakis), then take the first n
  const keyed = pool.map(c => ({c, k: Math.pow(Math.random(), 1 / WEIGHT[boxOf(c.id)])})).sort((a,b) => b.k - a.k);
  return shuffle(keyed.slice(0, n).map(x => x.c.id));
}

function renderSetup(){
  const cfg = S.cfg;
  for (const seg of document.querySelectorAll('#home .seg')) {
    const v = String(cfg[seg.dataset.key]);
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v===v));
  }
  $('picker').hidden = cfg.letters !== 'pick';
  $('picker').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', cfg.picked.includes(b.dataset.id)));
  const n = poolFor(cfg).length, take = Math.min(n, +cfg.len || n);
  $('avail').textContent = n ? `${n} cards match` : (cfg.focus==='learn' ? 'No cards in “still learning” yet' : cfg.focus==='new' ? 'No new cards left here' : 'Choose at least one letter');
  $('startBtn').textContent = n ? `Start · ${take} cards` : 'Start';
  $('startBtn').disabled = !n;
}
document.querySelectorAll('#home .seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.cfg[seg.dataset.key] = b.dataset.v; save(); renderSetup();
}));
$('picker').innerHTML = DB.letters.map(L => `<button data-id="${L.id}" title="${L.name}">${L.char}</button>`).join('');
$('picker').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const p = S.cfg.picked, i = p.indexOf(b.dataset.id); i<0 ? p.push(b.dataset.id) : p.splice(i,1);
  save(); renderSetup();
});

/* ---------- Home: progress + history ---------- */
const BOXCOL = i => `var(--b${i})`;
function legendHTML(){ return [0,1,2,3,4,5].map(i => `<span><i style="background:${BOXCOL(i)}"></i>${BOX_LABEL[i]}</span>`).join(''); }
function renderHome(){
  const counts = [0,0,0,0,0,0]; ALL.forEach(c => counts[boxOf(c.id)]++);
  $('stKnown').textContent = counts[4] + counts[5];
  $('stLearn').textContent = counts[1] + counts[2] + counts[3];
  $('stNew').textContent = counts[0];
  $('boxbar').innerHTML = [1,2,3,4,5,0].map(i => counts[i] ? `<i style="width:${counts[i]/ALL.length*100}%;background:${BOXCOL(i)}" title="${BOX_LABEL[i]}: ${counts[i]}"></i>` : '').join('');
  $('legend').innerHTML = legendHTML();
  const hs = S.sessions.slice(0, 6);
  $('histPanel').hidden = !hs.length;
  $('hist').innerHTML = hs.map(s => {
    const d = new Date(s.d);
    return `<li><span>${d.toLocaleDateString(undefined,{day:'numeric',month:'short'})} ${d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})} · ${s.label}</span><span class="r">${s.ok} ✓ · ${s.bad} ✗</span></li>`;
  }).join('');
  $('storeNote').textContent = storageOK ? 'Progress is saved in this browser on this device.' : 'This browser is not saving progress (private mode or blocked storage).';
  renderSetup();
}

/* ---------- Screens ---------- */
function showScreen(id){ for (const s of ['home','session','summary','overview']) $(s).hidden = s!==id; window.scrollTo(0,0); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true, 2200); }

/* ---------- Audio ---------- */
const player = new Audio(); let playingBtn = null, fallback = '', seq = [], gapTimer = null;
const VOICE_ORDER = {both:['male','female'], male:['male'], female:['female']};   // male = Miro, female = Dii
const voicesFor = () => VOICE_ORDER[S.cfg.voice] || VOICE_ORDER.both;
function speak(text){
  if (!text || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ar-SA'; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function stopAudio(){
  clearTimeout(gapTimer); seq = []; player.pause();
  if (playingBtn) playingBtn.classList.remove('playing'); playingBtn = null;
}
/* rel = 'letters/<id>.mp3' or 'words/<id>-<form>.mp3'; plays male, 1 s pause, female (or one voice, per setting) */
function play(rel, text, btn){
  stopAudio(); playingBtn = btn; fallback = text; btn && btn.classList.add('playing');
  seq = voicesFor().map(v => `audio/${v}/${rel}`); playNext();
}
function playNext(){
  const src = seq.shift();
  if (!src) { if (playingBtn) playingBtn.classList.remove('playing'); playingBtn = null; return; }
  player.src = src; player.currentTime = 0;
  const p = player.play(); if (p && p.catch) p.catch(() => {});
}
player.addEventListener('ended', () => { if (seq.length) gapTimer = setTimeout(playNext, 1000); else playNext(); });
player.addEventListener('error', () => { stopAudio(); speak(fallback); });
const letterSrc = L => `letters/${L.id}.mp3`;
const wordSrc = (L, f) => `words/${L.id}-${f}.mp3`;
const wordText = w => w.pre + w.t + w.post;

/* ---------- Icons (Lucide style) ---------- */
const ICON = {
  flip: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>`,
  happy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
  sad: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
  speaker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`
};

/* ---------- Card rendering ---------- */
const card = $('card'), front = $('front'), back = $('back');
function renderFront(c){
  const main = c.opt==='B' ? `<div class="f-name">${nameHTML(c.L)}</div>` : `<div class="ar f-glyph">${formGlyph(c.L, c.form)}</div>`;
  front.innerHTML = `<div class="front-main">${main}</div>
    <button class="flipbtn" id="flipBtn" aria-label="Show the answer">${ICON.flip}</button>`;
  $('flipBtn').onclick = () => flip(true);
}
function renderBack(c){
  const cells = FORM_ORDER.map(f => isValid(c.L, f) ? `
    <div class="cell ${f===c.form?'on':''}"><div class="g ar">${formGlyph(c.L,f)}</div><div class="lb">${DB.forms[f].en}<br>${DB.forms[f].ru}</div></div>`
    : `<div class="cell empty"></div>`).join('');
  let main;
  if (c.opt==='A') {
    main = `<button class="snd s2" data-src="${wordSrc(c.L,c.form)}" data-text="${wordText(c.w)}" aria-label="Play the word">${ICON.speaker}</button>
      <div class="ar word">${joinedHTML(c.w.pre,c.w.t,c.w.post,'ctx','hl')}</div>
      ${prHTML(c.w)}<div class="en">${c.w.en}</div><div class="ru">${c.w.ru}</div>`;
  } else {
    main = `<div class="wgrid">${FORM_ORDER.filter(f => isValid(c.L,f) && c.L.words[f]).map(f => { const w=c.L.words[f]; return `
      <div class="wt">
        <button class="snd" data-src="${wordSrc(c.L,f)}" data-text="${wordText(w)}" aria-label="Play ${w.tr}">${ICON.speaker}</button>
        <div class="fl">${DB.forms[f].en} · ${DB.forms[f].ru}</div>
        <div class="ar word">${joinedHTML(w.pre,w.t,w.post,'ctx','hl')}</div>
        ${prHTML(w)}<div class="en">${w.en}</div><div class="ru">${w.ru}</div>
      </div>`; }).join('')}</div>`;
  }
  back.innerHTML = `
    <div class="b1">
      <button class="snd s1" data-src="${letterSrc(c.L)}" data-text="${c.L.char}" aria-label="Play the letter sound">${ICON.speaker}</button>
      <div class="b1-top"><span class="ar b1-letter">${c.L.char}</span><span class="b1-name">${nameHTML(c.L)}</span></div>
      <div class="cells">${cells}</div>
    </div>
    <div class="b2">
      <div class="b2-main">${main}</div>
      <div class="answer">
        <button class="abtn happy" data-ok="1" aria-label="I knew that">${ICON.happy}</button>
        <button class="abtn sad" data-ok="0" aria-label="I still have to learn it">${ICON.sad}</button>
      </div>
    </div>`;
}
back.addEventListener('click', e => {
  const snd = e.target.closest('.snd'); if (snd) { play(snd.dataset.src, snd.dataset.text, snd); return; }
  const ab = e.target.closest('.abtn'); if (ab) { answer(ab.dataset.ok==='1'); return; }
  flip(false);   // tap elsewhere on the answer side turns the card back
});
function flip(on){ card.classList.toggle('flipped', on===undefined ? !card.classList.contains('flipped') : on); }

/* ---------- Session flow ---------- */
let sess = null;
function startSession(ids, label){
  if (!ids.length) return;
  sess = {ids, i:0, ok:[], bad:[], label};
  showScreen('session'); showCard();
}
function showCard(){
  stopAudio();
  const inner = card.querySelector('.inner');
  inner.style.transition='none'; card.classList.remove('flipped'); void inner.offsetWidth; inner.style.transition='';
  const c = BYID[sess.ids[sess.i]];
  renderFront(c); renderBack(c);
  $('pfill').style.width = (sess.i / sess.ids.length * 100) + '%';
  $('pnum').textContent = `${sess.i + 1} / ${sess.ids.length}`;
  $('tH').innerHTML = ICON.happy + sess.ok.length; $('tS').innerHTML = ICON.sad + sess.bad.length;
}
function answer(ok){
  const id = sess.ids[sess.i];
  record(id, ok); (ok ? sess.ok : sess.bad).push(id);
  sess.i++;
  if (sess.i >= sess.ids.length) finish(); else showCard();
}
function finish(){
  stopAudio();
  const n = sess.ok.length + sess.bad.length;
  if (n) { S.sessions.unshift({d:Date.now(), label:sess.label, n, ok:sess.ok.length, bad:sess.bad.length}); S.sessions = S.sessions.slice(0,50); save(); }
  $('sumOk').textContent = sess.ok.length; $('sumBad').textContent = sess.bad.length;
  $('sumOkL').innerHTML = ' ' + ICON.happy.replace('<svg','<svg style="color:var(--happy)"') + ' knew';
  $('sumBadL').innerHTML = ' ' + ICON.sad.replace('<svg','<svg style="color:var(--sad)"') + ' to learn';
  $('sumMissPanel').hidden = !sess.bad.length; $('repeatBtn').hidden = !sess.bad.length;
  $('sumMiss').innerHTML = sess.bad.map(id => { const c = BYID[id];
    return c.opt==='A' ? `<span class="chip ar">${formGlyph(c.L,c.form)}</span>` : `<span class="chip lat">${c.L.name}</span>`; }).join('');
  showScreen('summary');
}
function cfgLabel(cfg){
  const l = {all:'All letters', base:'Alphabet', variant:'Variants', pick:`${cfg.picked.length} letters`}[cfg.letters];
  const t = {AB:'', A:', forms', B:', names'}[cfg.types];
  const f = {mix:'', learn:', still learning', new:', new'}[cfg.focus];
  return l + t + f;
}
$('startBtn').onclick = () => startSession(drawCards(S.cfg), cfgLabel(S.cfg));
$('endBtn').onclick = () => finish();
$('repeatBtn').onclick = () => startSession(shuffle([...sess.bad]), 'Mistakes again');
$('homeBtn').onclick = () => { renderHome(); showScreen('home'); };

/* ---------- Overview ---------- */
$('ovBtn').onclick = () => {
  $('legend2').innerHTML = legendHTML();
  $('ov').innerHTML = DB.letters.map(L => {
    const dots = FORM_ORDER.map(f => isValid(L,f) && L.words[f] ? `<i style="background:${BOXCOL(boxOf(`${L.id}-${f}-A`))}" title="${f}"></i>` : `<i class="na"></i>`).join('');
    return `<div class="ovt"><div class="ar">${L.char}</div><div class="dots">${dots}<i class="bb" style="background:${BOXCOL(boxOf(`${L.id}-B`))}" title="name"></i></div><div class="nm">${L.name}</div></div>`;
  }).join('');
  showScreen('overview');
};
$('ovBack').onclick = () => { renderHome(); showScreen('home'); };

/* ---------- Backup / restore / reset ---------- */
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({app:'arabic-letter-cards', version:2, saved:new Date().toISOString(), ...S}, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `arabic-cards-progress-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup file saved');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d.cards !== 'object') throw new Error();
    S = {cards:d.cards, sessions:d.sessions||[], cfg:{...DEFAULT_CFG, ...(d.cfg||{})}}; save(); renderHome(); toast('Progress restored');
  } catch(err) { toast('That file is not a progress backup'); }
};
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = 'Tap again to erase all progress';
    setTimeout(() => { b.classList.remove('confirm'); b.textContent = 'Reset progress'; }, 4000); return; }
  S = {cards:{}, sessions:[], cfg:S.cfg}; save(); b.classList.remove('confirm'); b.textContent = 'Reset progress'; renderHome(); toast('Progress erased');
};

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if ($('session').hidden || /INPUT|SELECT/.test(e.target.tagName)) return;
  if (e.code==='Space') { e.preventDefault(); flip(); }
  if (card.classList.contains('flipped')) { if (e.key==='1') answer(true); if (e.key==='2') answer(false); }
});

renderHome();
</script>
</body>
</html>
